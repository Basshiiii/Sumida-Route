<style>

    --ink:#1C2321; --ink-soft:#5B655F; --ink-faint:#8B958F;
    --accent:#22456B; --accent-strong:#16324F; --accent-soft:#DCE6EF; --accent-soft-ink:#173350;

    --absent:#B8842A; --absent-soft:#F5E8D2;
    --skip:#8B5E52; --skip-soft:#EEE1DC;
    --pending-soft:#E7EAE9;
    --danger:#B33F3F;
    --shadow: 0 1px 2px rgba(20,30,28,.06), 0 4px 14px rgba(20,30,28,.07);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181A; --surface:#1B2326; --surface-2:#2A3438; --surface-3:#202A2D;
      --ink:#E7ECEA; --ink-soft:#9FADA8; --ink-faint:#6C7A75;
      --accent:#7FAED4; --accent-strong:#9DC4E4; --accent-soft:#23394A; --accent-soft-ink:#BFDCF0;
      --done:#6FBE8C; --done-soft:#1D3327;
      --absent:#DBAA56; --absent-soft:#3A2E17;
      --skip:#CB9A8A; --skip-soft:#33241F;
      --pending-soft:#2A3438;
      --danger:#E08080;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181A; --surface:#1B2326; --surface-2:#2A3438; --surface-3:#202A2D;
    --ink:#E7ECEA; --ink-soft:#9FADA8; --ink-faint:#6C7A75;
    --accent:#7FAED4; --accent-strong:#9DC4E4; --accent-soft:#23394A; --accent-soft-ink:#BFDCF0;
    --done:#6FBE8C; --done-soft:#1D3327;
    --absent:#DBAA56; --absent-soft:#3A2E17;
    --skip:#CB9A8A; --skip-soft:#33241F;
    --pending-soft:#2A3438;
    --danger:#E08080;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    font-variant-numeric: tabular-nums;
    overscroll-behavior-y: none;
  }
  h1,h2,h3,.disp{ font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif; text-wrap:balance; }
  button{ font-family:inherit; }
  #app{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }

  .topbar{ position:sticky; top:0; z-index:20; background:var(--accent); color:#fff; padding:10px 14px 12px; box-shadow:var(--shadow); }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .topbar h1{ font-size:16px; font-weight:700; margin:0; letter-spacing:.02em; }
  .save-badge{ font-size:11px; padding:3px 8px; border-radius:99px; background:rgba(255,255,255,.16); display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:#8FE0A8; }
  .progress-strip{ margin-top:10px; }
  .progress-strip .num{ font-size:20px; font-weight:700; font-family:"Zen Kaku Gothic New",sans-serif; }
  .progress-strip .lbl{ font-size:11px; opacity:.85; }
  .progress-bar{ height:6px; border-radius:99px; background:rgba(255,255,255,.22); margin-top:8px; overflow:hidden; }
  .progress-bar > i{ display:block; height:100%; background:#fff; border-radius:99px; }
  .stat-row{ display:flex; gap:16px; margin-top:2px; }

  .tabbar{ position:sticky; bottom:0; z-index:20; display:flex; background:var(--surface); border-top:1px solid var(--surface-2); box-shadow:0 -2px 10px rgba(0,0,0,.05); }
  .tab{ flex:1; border:none; background:none; padding:10px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-faint); cursor:pointer; }
  .tab .ic{ font-size:20px; line-height:1; }
  .tab .tl{ font-size:11.5px; font-weight:700; font-family:"Zen Kaku Gothic New",sans-serif; }
  .tab.active{ color:var(--accent); }

  .view{ flex:1; padding:12px 14px 24px; display:none; }
  .view.active{ display:block; }

  .card{ background:var(--surface); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); margin-bottom:12px; }
  .card h2{ font-size:14px; margin:0 0 8px; color:var(--ink); }
  .muted{ color:var(--ink-soft); font-size:12.5px; }
  .chiprow{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chiprow::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; border:1px solid var(--surface-2); background:var(--surface); color:var(--ink-soft); padding:6px 12px; border-radius:99px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chip.on{ background:var(--accent-soft); border-color:var(--accent-soft); color:var(--accent-soft-ink); }
  .field-row{ display:flex; gap:10px; align-items:center; }
  input[type="time"], input[type="text"], input[type="search"]{
    font-family:inherit; border:1px solid var(--surface-2); background:var(--surface-3); color:var(--ink);
    border-radius:10px; padding:8px 10px; font-size:14px; width:100%;
  }
  input:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .btn{ border:none; border-radius:11px; padding:11px 16px; font-weight:700; font-size:14px; cursor:pointer; font-family:"Zen Kaku Gothic New",sans-serif; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-strong); }
  .btn-ghost{ background:var(--surface-3); color:var(--ink); }
  .btn-outline{ background:transparent; border:1px solid var(--surface-2); color:var(--ink); }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:8px; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .link-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:12.5px; padding:4px 2px; cursor:pointer; white-space:nowrap; font-family:"Zen Kaku Gothic New",sans-serif; }

  .storelist{ display:flex; flex-direction:column; gap:8px; }
  .store{ background:var(--surface); border-radius:12px; box-shadow:var(--shadow); padding:10px 12px 10px 10px; display:flex; gap:10px; border-left:4px solid var(--surface-2); }
  .store.st-pending{ border-left-color:var(--ink-faint); }
  .store.st-done{ border-left-color:var(--done); }
  .store.st-absent{ border-left-color:var(--absent); }
  .store.st-skip{ border-left-color:var(--skip); opacity:.7; }
  .store .chk{ flex:none; width:22px; height:22px; margin-top:2px; accent-color:var(--accent); }
  .store .body{ flex:1; min-width:0; }
  .store .row1{ display:flex; align-items:baseline; gap:6px; }
  .store .no{ font-size:11px; color:var(--ink-faint); font-weight:700; }
  .store .name{ font-size:14.5px; font-weight:700; overflow-wrap:anywhere; }
  .store .addr{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; overflow-wrap:anywhere; }
  .store .cat{ font-size:11px; color:var(--ink-faint); margin-top:3px; }
  .store .actions{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .store .noteinput{ margin-top:8px; font-size:12.5px; padding:7px 9px; }
  .pill{ border:1px solid var(--surface-2); background:var(--surface-3); color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:99px; cursor:pointer; font-family:"Zen Kaku Gothic New",sans-serif; }

  .pill.active-absent{ background:var(--absent-soft); color:var(--absent); border-color:var(--absent-soft); }
  .pill.active-skip{ background:var(--skip-soft); color:var(--skip); border-color:var(--skip-soft); }

  .savebox .btn-row{ margin-top:8px; }

function toRad(d){ return d*Math.PI/180; }

  var R=6371, dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);

}

/* ---------- planning helper (time-budget scope picker) ---------- */
var ROAD_FACTOR = 1.35, SPEED_KMH = 13, STOP_MIN = 4;
function legMinutes(km){ return (km*ROAD_FACTOR/SPEED_KMH)*60; }
function autoSelectByBudget(base, candidates, budgetMin){
  var pool = candidates.slice();
  var chosen = [];
  var cur = base, cum = 0;
  while(pool.length){
    var bestIdx=-1, bestD=Infinity;
    for(var i=0;i<pool.length;i++){
      var d = haversineKm(cur, pool[i]);
      if(d<bestD){ bestD=d; bestIdx=i; }
    }
    var cand = pool[bestIdx];
    var addMin = legMinutes(bestD) + STOP_MIN;
    var backMin = legMinutes(haversineKm(cand, base));
    if(cum + addMin + backMin > budgetMin) break;
    cum += addMin;
    chosen.push(pool.splice(bestIdx,1)[0]);
    cur = cand;
  }
  return { chosen: chosen, estMin: cum };
}
function timeToMin(t){ var p=t.split(":"); return (+p[0])*60+(+p[1]); }

/* ---------- nearest-next (live, GPS-driven) ---------- */
function candidatePool(){
  var selNos = Object.keys(state.selected);
  var base = selNos.length ? selNos.map(function(n){ return storeById(+n); }).filter(Boolean) : state.stores;
  return base.filter(function(s){ return s.status==='pending'; });
}
function nearestFrom(pos, candidates){
  var best=null, bestD=Infinity;
  candidates.forEach(function(s){
    var d = haversineKm(pos, s);
    if(d<bestD){ bestD=d; best=s; }
  });
  return best ? { store:best, km:bestD } : null;
}

/* ---------- my position ---------- */
function loadMyPos(){
  try{
    var raw = localStorage.getItem('sumida-route-mypos');
    if(raw) myPos = JSON.parse(raw);
  }catch(e){}
}
function saveMyPos(){
  try{ localStorage.setItem('sumida-route-mypos', JSON.stringify(myPos)); }catch(e){}
}
function setMyPos(lat,lng,source,label){
  myPos = { lat:lat, lng:lng, source:source, label:label||null, at:Date.now() };
  saveMyPos();
  render();
}
function setMyPosToArea(area){
  var c = AREA_CENTROIDS[area];
  if(!c) return;
  setMyPos(c[0], c[1], 'area', area);
  mapFocusArea = area;
  render();
}
function fallbackPos(){
  var visited = state.stores.filter(function(s){ return s.status!=='pending' && s.statusAt; })
    .sort(function(a,b){ return b.statusAt - a.statusAt; });
  if(visited.length) setMyPos(visited[0].lat, visited[0].lng, 'lastvisit');
  else setMyPos(state.base.lat, state.base.lng, 'base');
}
function toggleGpsWatch(){
  if(geoWatchId!=null){
    navigator.geolocation.clearWatch(geoWatchId);
    geoWatchId = null;
    render();
    return;
  }
  if(!navigator.geolocation){ alert('この端末・ブラウザは位置情報に対応していません'); return; }
  geoWatchId = navigator.geolocation.watchPosition(function(pos){
    setMyPos(pos.coords.latitude, pos.coords.longitude, 'gps');
  }, function(err){
    alert('位置情報を取得できませんでした: ' + err.message);
    geoWatchId = null;
    render();
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  render();
}
function locSourceLabel(pos){
  var src = pos.source;
  if(src==='gps') return 'GPSで自動追尾中';
  if(src==='manual') return '地図タップで手動設定';
  if(src==='area') return '選択したエリア「'+pos.label+'」を仮の現在地に使用中';
  if(src==='lastvisit') return '直前に完了した店舗を仮の現在地に使用中';
  return '出発地点(iU)を仮の現在地に使用中';
}

/* ---------- render helpers ---------- */
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text!=null) e.textContent = text;
  return e;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function mapsSearchUrl(s){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.lat+","+s.lng); }
function mapsDirUrl(s){ return "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng + "&travelmode=driving"; }
function countsByStatus(list){
  var c = {pending:0,done:0,absent:0,skip:0};
  list.forEach(function(s){ c[s.status] = (c[s.status]||0)+1; });
  return c;
}
function filteredStores(){
  var f = state.filters;
  return state.stores.filter(function(s){
    if(f.areas.length && f.areas.indexOf(s.area)===-1) return false;
    if(f.status==="handled"){ if(s.status==='pending') return false; }
    else if(f.status!=="all" && s.status!==f.status) return false;
    if(f.q){
      var q = f.q.toLowerCase();
      if(s.name.toLowerCase().indexOf(q)===-1 && s.address.toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  });
}

/* ---------- persistence (local device only) ---------- */
function saveLocal(){
  try{
    state.updatedAt = Date.now();
    localStorage.setItem('sumida-route-state', JSON.stringify(state));
    lastSavedAt = Date.now();
  }catch(e){}
}
function loadLocal(){
  try{
    var raw = localStorage.getItem('sumida-route-state');
    if(!raw) return;
    var local = JSON.parse(raw);
    if(local.updatedAt && (!state.updatedAt || local.updatedAt >= state.updatedAt)){
      state = local;
    }
  }catch(e){}
}
function exportState(){
  var blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'sumida-route-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function importStateFromFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var incoming = JSON.parse(reader.result);
      if(!incoming.stores || !Array.isArray(incoming.stores)) throw new Error('invalid');
      state = incoming;
      saveLocal();
      render();
      alert('読み込みました');
    }catch(e){
      alert('ファイルの読み込みに失敗しました');
    }
  };
  reader.readAsText(file);
}

/* ---------- Google Sheets sync (via Apps Script Web App) ---------- */
var sheetsSyncBusy = false;
function setSheetsWebhookUrl(url){
  state.sheetsWebhookUrl = url.trim();
  saveLocal();
}
function syncToSheet(){
  if(!state.sheetsWebhookUrl){ alert('先にApps Script のWebアプリURLを入力してください'); return; }
  var items = state.stores.filter(function(s){ return s.status!=='pending' || (s.note && s.note.trim()); })
    .map(function(s){ return { name:s.name, address:s.address, status:STATUS_LABEL[s.status], note:s.note||'' }; });
  if(!items.length){ alert('反映する変更がありません'); return; }
  sheetsSyncBusy = true; render();
  fetch(state.sheetsWebhookUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ items: items })
  }).then(function(r){ return r.json(); }).then(function(res){
    sheetsSyncBusy = false; render();
    if(res && res.ok) alert('スプレッドシートに反映しました（'+res.updated+'件更新、'+(items.length-res.updated)+'件は該当行が見つかりませんでした）');
    else alert('反映に失敗しました: ' + (res && res.error ? res.error : '不明なエラー'));
  }).catch(function(err){
    sheetsSyncBusy = false; render();
    alert('通信エラーで反映できませんでした。URLが正しいか、Apps Scriptが正しく公開されているか確認してください。\n('+err.message+')');
  });
}
function renderSheetsSyncBox(){
  var box = el('div','savebox');
  box.appendChild(el('h2',null,'📊 スプレッドシートに反映'));
  box.appendChild(el('div','muted','Google Apps Script のWebアプリURLを一度だけ設定すると、ボタン一つで進捗・備考を元のスプレッドシート(シート2)に書き戻せます。'));
  var urlInput = document.createElement('input');
  urlInput.type = 'text'; urlInput.placeholder = 'https://script.google.com/macros/s/.../exec';
  urlInput.value = state.sheetsWebhookUrl || '';
  urlInput.style.marginTop = '8px';
  urlInput.onchange = function(){ setSheetsWebhookUrl(urlInput.value); };
  box.appendChild(urlInput);
  var btnRow2 = el('div','btn-row'); btnRow2.style.marginTop='8px';
  var syncBtn = el('button','btn btn-primary', sheetsSyncBusy ? '反映中…' : '📤 スプレッドシートに反映');
  syncBtn.disabled = sheetsSyncBusy;
  syncBtn.onclick = function(){ syncToSheet(); };
  btnRow2.appendChild(syncBtn);
  box.appendChild(btnRow2);
  return box;
}

/* ---------- mutations ---------- */
function setStatus(no, status){
  var s = storeById(no);
  if(!s) return;
  s.status = status;
  s.statusAt = Date.now();
  render();
  saveLocal();
}
function setNote(no, note){
  var s = storeById(no);
  if(!s) return;
  s.note = note;
  saveLocal();
}
function toggleSelected(no){
  if(state.selected[no]) delete state.selected[no];
  else state.selected[no] = true;
  render();
  saveLocal();
}
function toggleArea(area){
  var i = state.filters.areas.indexOf(area);
  if(i===-1) state.filters.areas.push(area); else state.filters.areas.splice(i,1);
  render(); saveLocal();
}
function setStatusFilter(v){ state.filters.status = v; render(); saveLocal(); }
function pinFirst(no){
  state.pinnedFirst = no;
  state.activeTab = 'map';
  render(); saveLocal();
}
function unpinFirst(){
  state.pinnedFirst = null;
  render(); saveLocal();
}

/* ---------- Leaflet map (persistent instance, never recreated) ---------- */
var mapContainer = null, leafletMap = null, markersLayer = null, meLayer = null;
function ensureMap(){
  if(leafletMap) return;
  mapContainer = document.createElement('div');
  mapContainer.className = 'mapbox';
  leafletMap = L.map(mapContainer, { attributionControl:true }).setView([state.base.lat, state.base.lng], 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(leafletMap);
  L.polygon(WARD_OUTLINE.map(function(p){return [p[0],p[1]];}), {
    color:'#22456B', weight:1.5, opacity:0.35, fill:false
  }).addTo(leafletMap);
  markersLayer = L.layerGroup().addTo(leafletMap);
  meLayer = L.layerGroup().addTo(leafletMap);
  leafletMap.on('click', function(e){ setMyPos(e.latlng.lat, e.latlng.lng, 'manual'); });
}
function updateMapMarkers(allStores, nextStore){
  ensureMap();
  markersLayer.clearLayers();
  allStores.forEach(function(s){
    if(nextStore && s.no===nextStore.no) return;
    L.circleMarker([s.lat, s.lng], {
      radius: s.status==='pending' ? 5 : 6,
      color:'#fff', weight:1,
      fillColor: STATUS_HEX[s.status], fillOpacity: s.status==='pending' ? 0.75 : 0.95
    }).bindTooltip(s.name, {direction:'top', offset:[0,-4]}).addTo(markersLayer);
  });
  if(nextStore){
    L.circleMarker([nextStore.lat, nextStore.lng], {
      radius: 11, color:'#fff', weight:3,
      fillColor: '#22456B', fillOpacity: 1
    }).bindTooltip(nextStore.name + '（次はここ）', {permanent:false, direction:'top', offset:[0,-8]}).addTo(markersLayer);
  }
  meLayer.clearLayers();
  if(myPos){
    var icon = L.divIcon({ className:'', html:'<div class="me-dotwrap"><div class="me-pulse"></div><div class="me-dot"></div></div>', iconSize:[20,20], iconAnchor:[10,10] });
    L.marker([myPos.lat, myPos.lng], {icon:icon, interactive:false}).addTo(meLayer);
  }
}
function recenterMap(){
  ensureMap();
  if(myPos) leafletMap.setView([myPos.lat, myPos.lng], Math.max(leafletMap.getZoom(), 16));
}
function focusMapOnArea(area){
  ensureMap();
  var pts = state.stores.filter(function(s){return s.area===area;}).map(function(s){return [s.lat,s.lng];});
  if(pts.length) leafletMap.fitBounds(pts, {padding:[24,24], maxZoom:17});
}

/* ---------- views ---------- */
var appRoot;
function render(){
  if(!appRoot) return;
  clear(appRoot);
  appRoot.appendChild(renderTopbar());
  var view = el('div','view active');
  if(state.activeTab==='list') renderList(view);
  else renderMap(view);
  appRoot.appendChild(view);
  appRoot.appendChild(renderTabbar());
}

function renderTopbar(){
  var bar = el('div','topbar');
  var row = el('div','topbar-row');
  row.appendChild(el('h1',null,'墨田区チラシ配布ルート'));
  var badge = el('div','save-badge');
  badge.appendChild(el('span','save-dot'));
  badge.appendChild(document.createTextNode('この端末に保存中'));
  row.appendChild(badge);
  bar.appendChild(row);

  var total = state.stores.length;
  var c = countsByStatus(state.stores);
  var strip = el('div','progress-strip');
  var statRow = el('div','stat-row');
  var s1 = el('div'); s1.appendChild(el('div','num',String(c.done))); s1.appendChild(el('div','lbl','配布完了'));
  var s2 = el('div'); s2.appendChild(el('div','num',String(total-c.done-c.skip))); s2.appendChild(el('div','lbl','残り(未対応+不在)'));
  var s3 = el('div'); s3.appendChild(el('div','num',String(total))); s3.appendChild(el('div','lbl','全店舗'));
  statRow.appendChild(s1); statRow.appendChild(s2); statRow.appendChild(s3);
  strip.appendChild(statRow);
  var track = el('div','progress-bar');
  var bar2 = el('i'); bar2.style.width = (total? (c.done/total*100):0)+'%';
  track.appendChild(bar2);
  strip.appendChild(track);
  bar.appendChild(strip);
  return bar;
}

function renderTabbar(){
  var bar = el('div','tabbar');
  [['map','🧭','次はここ'],['list','📍','一覧・管理']].forEach(function(t){
    var b = el('button','tab'+(state.activeTab===t[0]?' active':''));
    b.appendChild(el('span','ic',t[1]));
    b.appendChild(el('span','tl',t[2]));
    b.onclick = function(){ state.activeTab = t[0]; render(); };
    bar.appendChild(b);
  });
  return bar;
}

function filterCard(){
  var card = el('div','card');
  card.appendChild(el('h2',null,'エリアで絞り込み'));
  var chips = el('div','chiprow');
  AREA_ORDER.forEach(function(area){
    if(!state.stores.some(function(s){return s.area===area;})) return;
    var chip = el('button','chip'+(state.filters.areas.indexOf(area)!==-1?' on':''), area);
    chip.onclick = function(){ toggleArea(area); };
    chips.appendChild(chip);
  });
  card.appendChild(chips);

  var chips2 = el('div','chiprow'); chips2.style.marginTop='8px';
  [['pending','未対応'],['handled','✅対応済み'],['done','訪問済み'],['absent','不在'],['skip','スキップ'],['all','すべて']].forEach(function(t){
    var chip = el('button','chip'+(state.filters.status===t[0]?' on':''), t[1]);
    chip.onclick = function(){ setStatusFilter(t[0]); };
    chips2.appendChild(chip);
  });
  card.appendChild(chips2);

  var q = el('input'); q.type='search'; q.placeholder='店名・住所で検索'; q.value=state.filters.q; q.style.marginTop='8px';
  q.oninput = function(){ state.filters.q = q.value; render(); saveLocal(); };
  card.appendChild(q);
  return card;
}

function storeRow(s){
  var row = el('div','store st-'+s.status);
  var chk = document.createElement('input');
  chk.type='checkbox'; chk.className='chk';
  chk.checked = !!state.selected[s.no];
  chk.title = '本日の対象に入れる';
  chk.onchange = function(){ toggleSelected(s.no); };
  row.appendChild(chk);

  var body = el('div','body');
  var row1 = el('div','row1');
  row1.appendChild(el('span','no','#'+s.no));
  row1.appendChild(el('span','name',s.name));
  body.appendChild(row1);
  body.appendChild(el('div','addr', s.address));
  body.appendChild(el('div','cat', '['+s.area+'] '+(s.category||'')));
  if(s.status!=='pending' && s.statusAt){
    body.appendChild(el('div','cat', STATUS_LABEL[s.status]+': '+fmtWhen(s.statusAt)));
  }

  var actions = el('div','actions');
  STATUS_CYCLE.forEach(function(st){
    var p = el('button','pill'+(s.status===st?' active-'+st:''), STATUS_LABEL[st]);
    p.onclick = function(){ setStatus(s.no, st); };
    actions.appendChild(p);
  });
  var mapLink = document.createElement('a');
  mapLink.className='pill link'; mapLink.textContent='地図';
  mapLink.href = mapsSearchUrl(s); mapLink.target='_blank'; mapLink.rel='noopener';
  actions.appendChild(mapLink);
  if(s.status==='pending'){
    var pinBtn = el('button','pill'+(state.pinnedFirst===s.no?' pin-pill':''), state.pinnedFirst===s.no ? '📌 最初に指定中' : '🚩 最初にする');
    pinBtn.onclick = function(){ state.pinnedFirst===s.no ? unpinFirst() : pinFirst(s.no); };
    actions.appendChild(pinBtn);
  }
  body.appendChild(actions);

  var noteInput = document.createElement('input');
  noteInput.type = 'text'; noteInput.className = 'noteinput';
  noteInput.placeholder = '備考(言われたこと・不在時の様子など)';
  noteInput.value = s.note || '';
  noteInput.onchange = function(){ setNote(s.no, noteInput.value); };
  body.appendChild(noteInput);

  row.appendChild(body);
  return row;
}

/* ---------- MAP / NEXT tab ---------- */
function renderMap(view){
  var candidates = candidatePool();
  var scopeCount = Object.keys(state.selected).length;

  var scopeRow = el('div','scope-row');
  scopeRow.appendChild(el('span',null, scopeCount ? ('本日の対象: 選択した'+scopeCount+'件') : ('本日の対象: 未対応の全'+candidates.length+'件')));
  var editScope = el('button','link-btn','対象を絞る ›');
  editScope.onclick = function(){ state.activeTab='list'; render(); };
  scopeRow.appendChild(editScope);
  view.appendChild(scopeRow);

  if(!candidates.length){
    var doneAll = el('div','done-hero');
    doneAll.appendChild(el('div','big','🎉'));
    doneAll.appendChild(el('div',null,'対象の店舗はすべて対応済みです'));
    view.appendChild(doneAll);
    updateMapMarkers(state.stores, null);
    view.appendChild(mapContainer);
    setTimeout(function(){ leafletMap.invalidateSize(); }, 0);
    return;
  }

  var pinnedStore = state.pinnedFirst ? storeById(state.pinnedFirst) : null;
  if(pinnedStore && pinnedStore.status !== 'pending'){ state.pinnedFirst = null; pinnedStore = null; saveLocal(); }

  var next;
  if(pinnedStore){
    next = { store: pinnedStore, km: myPos ? haversineKm(myPos, pinnedStore) : null };
  } else {
    next = myPos ? nearestFrom(myPos, candidates) : { store: candidates[0], km: null };
  }
  var s = next.store;

  var card = el('div','next-card');
  card.appendChild(el('div','next-label', pinnedStore ? '📌 指定した訪問先' : '🧭 次はここ（現在地から最短）'));
  card.appendChild(el('div','next-name', s.name));
  card.appendChild(el('div','next-addr', s.address));
  card.appendChild(el('div','next-cat', '['+s.area+'] '+(s.category||'')));
  if(next.km!=null) card.appendChild(el('div','next-dist','現在地から 約'+fmtDist(next.km)));
  if(pinnedStore){
    var pinBadge = el('div','pin-badge');
    pinBadge.appendChild(document.createTextNode('この店舗を最初に指定中'));
    var unpinBtn = document.createElement('button');
    unpinBtn.textContent = '解除して自動選出に戻す';
    unpinBtn.onclick = function(){ unpinFirst(); };
    pinBadge.appendChild(unpinBtn);
    card.appendChild(pinBadge);
  }
  var nav = document.createElement('a');
  nav.className='nav-btn'; nav.textContent='🚗 Googleマップでナビ開始';
  nav.href = mapsDirUrl(s); nav.target='_blank'; nav.rel='noopener';
  card.appendChild(nav);

  var statusRow = el('div','status-row');
  var doneBtn = el('button','btn btn-primary','✅ 配布完了');
  doneBtn.onclick = function(){ setStatus(s.no,'done'); };
  var absentBtn = el('button','btn btn-outline','不在・投函');
  absentBtn.onclick = function(){ setStatus(s.no,'absent'); };
  var skipBtn = el('button','btn btn-ghost','スキップ');
  skipBtn.onclick = function(){ setStatus(s.no,'skip'); };
  statusRow.appendChild(doneBtn); statusRow.appendChild(absentBtn); statusRow.appendChild(skipBtn);
  card.appendChild(statusRow);
  view.appendChild(card);

  var locRow = el('div','loc-row');
  locRow.appendChild(el('span',null,'現在地: ' + (myPos ? locSourceLabel(myPos) : '未設定')));
  var gpsBtn = el('button','link-btn', geoWatchId!=null ? '⏹ GPS追尾を停止' : '📍 GPS追尾を開始');
  gpsBtn.onclick = function(){ toggleGpsWatch(); };
  locRow.appendChild(gpsBtn);
  view.appendChild(locRow);

  if(myPos){
    var recenterRow = el('div','loc-row');
    var recenterBtn = el('button','link-btn','🎯 現在地に地図を合わせる');
    recenterBtn.onclick = function(){ recenterMap(); };
    recenterRow.appendChild(recenterBtn);
    view.appendChild(recenterRow);
  }

  view.appendChild(el('div','maphint','GPSが使えない場合は、近いエリア名をタップするか、地図を直接タップしてください'));
  var areaPickRow = el('div','chiprow');
  AREA_ORDER.forEach(function(area){
    if(!state.stores.some(function(st){return st.area===area;})) return;
    var chip = el('button','chip'+(myPos && myPos.source==='area' && myPos.label===area?' on':''), area);
    chip.onclick = function(){ setMyPosToArea(area); focusMapOnArea(area); };
    areaPickRow.appendChild(chip);
  });
  view.appendChild(areaPickRow);

  updateMapMarkers(candidates, s);
  view.appendChild(mapContainer);
  setTimeout(function(){ leafletMap.invalidateSize(); }, 0);

  var legend = el('div','legend');
  [['現在地','#2E7BDB'],['次はここ','#22456B'],['未対応','#8B958F'],['完了','#3D7A54']].forEach(function(l){
    var sp=el('span'); var i=document.createElement('i'); i.style.background=l[1]; sp.appendChild(i); sp.appendChild(document.createTextNode(l[0]));
    legend.appendChild(sp);
  });
  view.appendChild(legend);
}

/* ---------- LIST / MANAGE tab ---------- */
function renderList(view){
  view.appendChild(el('div','section-title','エリア別進捗'));
  var dash = el('div','card');
  AREA_ORDER.forEach(function(area){
    var areaStores = state.stores.filter(function(s){return s.area===area;});
    if(!areaStores.length) return;
    var done = areaStores.filter(function(s){return s.status==='done';}).length;
    var row = el('div','areabar-row');
    row.appendChild(el('span','aname',area));
    var track = el('div','areabar-track');
    var bar = el('i'); bar.style.width=(done/areaStores.length*100)+'%';
    track.appendChild(bar);
    row.appendChild(track);
    row.appendChild(el('span','acount', done+'/'+areaStores.length));
    dash.appendChild(row);
  });
  var handledCount = state.stores.filter(function(s){return s.status!=='pending';}).length;
  var dashBtnRow = el('div','btn-row'); dashBtnRow.style.marginTop='10px';
  var handledBtn = el('button','btn btn-outline','✅ 対応済み一覧を見る（'+handledCount+'件）');
  handledBtn.onclick = function(){
    state.filters.status = 'handled';
    render();
    var sl = document.querySelector('.storelist');
    if(sl) sl.scrollIntoView({behavior:'smooth', block:'start'});
  };
  dashBtnRow.appendChild(handledBtn);
  dash.appendChild(dashBtnRow);
  view.appendChild(dash);

  var scopeCount = Object.keys(state.selected).length;
  var details = document.createElement('details');
  details.className = 'scopebox';
  var summary = document.createElement('summary');
  summary.appendChild(document.createTextNode('本日の対象を絞る' + (scopeCount? '（選択中 '+scopeCount+'件）':'（未指定＝全店舗が対象）')));
  summary.appendChild(el('span','car','▾'));
  details.appendChild(summary);
  var inner = el('div','inner');
  inner.appendChild(el('div','muted','下のチェックボックスで店舗を選ぶと、「次はここ」タブの候補がその中だけに絞られます。何も選ばなければ未対応の全店舗が対象になります。'));

  var timeRow = el('div','field-row'); timeRow.style.marginTop='10px';
  var t1 = document.createElement('input'); t1.type='time'; t1.value=state.startTime;
  t1.onchange=function(){ state.startTime=t1.value; render(); saveLocal(); };
  var arrow = el('span',null,'→');
  var t2 = document.createElement('input'); t2.type='time'; t2.value=state.endTime;
  t2.onchange=function(){ state.endTime=t2.value; render(); saveLocal(); };
  timeRow.appendChild(t1); timeRow.appendChild(arrow); timeRow.appendChild(t2);
  inner.appendChild(timeRow);

  var btnRow = el('div','btn-row'); btnRow.style.marginTop='10px';
  var autoBtn = el('button','btn btn-outline','時間内で自動選出(iU発着の目安)');
  autoBtn.onclick = function(){
    var budgetMin = Math.max(0, timeToMin(state.endTime)-timeToMin(state.startTime));
    var pool = state.stores.filter(function(s){return s.status==='pending';});
    var r = autoSelectByBudget(state.base, pool, budgetMin);
    state.selected = {};
    r.chosen.forEach(function(s){ state.selected[s.no]=true; });
    render(); saveLocal();
  };
  var clearBtn = el('button','btn btn-ghost','選択解除');
  clearBtn.onclick = function(){ state.selected={}; render(); saveLocal(); };
  btnRow.appendChild(autoBtn); btnRow.appendChild(clearBtn);
  inner.appendChild(btnRow);

  details.open = scopeCount>0;
  details.appendChild(inner);
  view.appendChild(details);

  var saveBox = el('div','savebox');
  saveBox.appendChild(el('h2',null,'バックアップ / 他端末への引き継ぎ'));
  saveBox.appendChild(el('div','muted','この端末にだけ自動保存されています。他のスマホに進捗を移すには、書き出したファイルを送って読み込んでください。'));
  var saveBtnRow = el('div','btn-row');
  var exportBtn = el('button','btn btn-outline','📤 書き出す');
  exportBtn.onclick = function(){ exportState(); };
  var importLabel = document.createElement('label');
  importLabel.className = 'btn btn-outline';
  importLabel.textContent = '📥 読み込む';
  importLabel.style.textAlign = 'center';
  importLabel.style.cursor = 'pointer';
  var importInput = document.createElement('input');
  importInput.type = 'file'; importInput.accept = 'application/json'; importInput.style.display='none';
  importInput.onchange = function(){ if(importInput.files[0]) importStateFromFile(importInput.files[0]); };
  importLabel.appendChild(importInput);
  saveBtnRow.appendChild(exportBtn); saveBtnRow.appendChild(importLabel);
  saveBox.appendChild(saveBtnRow);
  view.appendChild(saveBox);

  view.appendChild(renderSheetsSyncBox());

  view.appendChild(filterCard());
  var list = filteredStores();
  view.appendChild(el('div','section-title','店舗一覧 ('+list.length+')'));
  var sl = el('div','storelist');
  if(list.length===0) sl.appendChild(el('div','empty','該当する店舗がありません'));
  list.forEach(function(s){ sl.appendChild(storeRow(s)); });
  view.appendChild(sl);
}

/* ---------- boot ---------- */
function boot(){
  loadLocal();
  loadMyPos();
  appRoot = document.getElementById('app');
  render();
  if(!myPos) fallbackPos();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
